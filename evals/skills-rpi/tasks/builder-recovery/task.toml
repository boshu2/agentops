schema_version = "1.4"
[task]
name = "agentops/builder-recovery"
version = "1.0.0"
description = "Exposed development case for skill-builder using the actual AO runtime."
[metadata]
family = "builder-recovery"
visibility = "development"
source_kind = "sanitized-standalone"
source_snapshot = "environment/source"
endpoint_reward_is_workflow_proof = false
workflow_mode = "actual-runtime-fixture"
[agent]
timeout_sec = 900
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "api.openai.com", "auth.openai.com", "auth0.openai.com"]
[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 8192
network_mode = "public"
[verifier]
timeout_sec = 180
environment_mode = "separate"
[verifier.environment]
docker_image = "agentops-skill-eval-verifier:builder-recovery-v1"
network_mode = "no-network"
cpus = 2
memory_mb = 4096
[[artifacts]]
source = "/app/work"
