schema_version: '1.1'
name: orchestrate
tags:
- routing
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    Mid-run status from the four agents I've got on the billing rewrite (I approved all four tasks this morning):

    - a1: finished the invoice PDF renderer, tests green on its branch, sitting idle
    - a2: stuck, needs the `invoices.currency` column that a3 was adding
    - a3: its tmux pane is just gone. Branch `a3/currency-col` has a migration file and a half-done model change, last commit 50 min ago
    - a4: still on the tax calc, looks fine

    How do I get this moving again without making a mess?
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestrate"'
