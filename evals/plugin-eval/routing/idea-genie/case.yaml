schema_version: '1.1'
name: idea-genie
tags:
- routing
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    I run the mobile app for a small climbing-gym chain. I've got about six weeks of dev time and I'm trying to figure out what's actually worth building. What I know:

    - App store feedback, last 90 days: 14 say the check-in QR code fails at the door when signal is bad, 6 ask for a route-setting schedule, 2 ask for dark mode.
    - Front desk says ~20% of members still check in by reading out their phone number.
    - Analytics: 71% of sessions are just opening the QR screen; the class-booking tab gets ~3%.
    - A competitor just launched social leaderboards. Nobody has asked us for that.

    Lay out a few solid options and what backs each one up. I'll make the call.
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?idea-genie"'
