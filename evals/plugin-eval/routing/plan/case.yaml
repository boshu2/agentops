schema_version: '1.1'
name: plan
tags:
- routing
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    PM dropped this in Slack: "customers should be able to pause their subscription." That's the entire spec. Before anyone writes code, help me turn it into something concrete we can build first. What exists today:

    ```ruby
    class Subscription < ApplicationRecord
      # status: active | canceled | past_due
      def renew!
        charge!(price.amount) && update!(current_period_end: current_period_end + 1.month)
      end
    end

    # RenewalJob, nightly:
    Subscription.where(status: "active").where("current_period_end < ?", Time.current).find_each(&:renew!)

    # Mailers::Dunning also selects on status: "past_due"
    ```

    Charging goes through Stripe. My gut says pause = a new status value, but I'm not sure.
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan"'
