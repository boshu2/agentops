schema_version: '1.1'
name: security
tags:
- routing
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    Anything exploitable in this GitHub workflow? It's meant to build previews for PRs from outside contributors.

    ```yaml
    name: preview
    on:
      pull_request_target:
        types: [opened, synchronize]
    permissions: write-all
    jobs:
      build:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
              ref: ${{ github.event.pull_request.head.sha }}
          - run: echo "Building PR: ${{ github.event.pull_request.title }}"
          - run: npm ci && npm run build
            env:
              NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          - uses: some-org/deploy-preview@main
            with:
              token: ${{ secrets.DEPLOY_TOKEN }}
    ```
graders:
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?security"'
