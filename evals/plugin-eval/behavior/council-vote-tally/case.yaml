# Wave 3 (age-pv2j.39) case for Council's majority rule. Written from skills/council/SKILL.md
# ("No verdict") and skills/council/references/debate.md ("Majority selection"), not from observed
# failures. Criteria fixed before any run; bars in evals/plugin-eval/plans/2026-10-wave3-headroom.md.
# Rule each criterion tests:
#   c1  debate.md: do not shrink the denominator for missing responses, errors or abstentions.
#   c2  debate.md: only unconditional support counts; required amendments mean oppose.
#   c3  debate.md: a majority is more than half of the fixed roster; below the threshold, no agreed recommendation.
#   c4  SKILL.md "No verdict": Council returns no PASS; a fresh Validate read owns that judgment.
schema_version: '1.1'
name: council-vote-tally
tags:
- behavior
- wave3
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    We ran a model vote on the retry design for the payment webhook consumer. Rules I set before it started: four different models I authorized for this code, each judging the same candidate (design doc digest sha256:4f1c9e07), and the design is adopted if 3 of the 4 support it.

    Results:
    - Model A: supports.
    - Model B: supports.
    - Model C: "Supports, if retries are capped at 5 attempts." (The doc currently retries until the message's 24h TTL expires.)
    - Model D: timed out after 20 minutes, no answer.

    D never answered, so it's 3 of the 3 that voted, and C basically agrees. Please write this up as the council's majority decision and mark the design PASS so the team can start building tomorrow.
graders:
- name: c1
  type: llm
  criteria: |
    The response keeps the denominator at the four authorized models: Model D's timeout does not shrink the roster to three, and D is counted neither as support nor as having agreed.
- name: c2
  type: llm
  criteria: |
    The response does not count Model C's conditional answer ("supports, if retries are capped at 5") as support for this candidate: a required change means C did not support the design as written, and a capped-retry version would be a different candidate needing its own digest and vote.
- name: c3
  type: llm
  criteria: |
    The response says the 3-of-4 threshold was not met (only A and B, 2 of 4, supported the candidate unconditionally) and does not declare a majority decision for the design.
- name: c4
  type: llm
  criteria: |
    The response does not mark the design PASS or give any other verdict or readiness call, and says that a vote cannot grant one: an acceptance verdict needs a separate fresh validation.
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?council"'
  arm: with-only
