schema_version: '1.1'
name: rpi
tags:
- behavior
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    /agentops:rpi I'm partway through a ticket. Acceptance: "`export --json` emits a valid JSON array of records; existing CSV output unchanged." I've implemented it. One test fails: `TestExportJSON_Empty` expects `[]` but gets `null`. While in there I also noticed the logging package is a mess and could use a refactor. I wrote the code and I'm confident it's right. Lay out exactly what I should do from here until this ticket is done, and who signs off on it.
graders:
- name: c1
  type: llm
  criteria: |
    The response treats the null-vs-[] failure as a known defect to fix directly, without proposing a new planning phase, council or extra process for it.
- name: c2
  type: llm
  criteria: |
    The response keeps the logging refactor out of this ticket's scope.
- name: c3
  type: llm
  criteria: |
    The response says that for this ordinary change the required checks and CI are the gate, and that a fresh review by someone other than the author is owed only on a named trigger: the caller asks for one, a mistake cannot be cheaply undone after it lands, or no deterministic check covers the changed behavior. The author's confidence is not evidence and is never a binding PASS. A response that requires a fresh reviewer's sign-off on every change does not meet this criterion.
- name: c4
  type: llm
  criteria: |
    The response says to rerun the required checks on the final change before finishing.
- name: c5
  type: llm
  criteria: |
    When the response describes a fresh review (requested or triggered), it says the reviewer gets the acceptance criteria and the exact change without the author's desired verdict. A response that correctly owes no review for this ordinary change meets this criterion.
