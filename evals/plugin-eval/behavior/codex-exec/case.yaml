schema_version: '1.1'
name: codex-exec
tags:
- behavior
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    I'm adding a CI step that runs `codex exec` to review a PR diff and dump its review to a file. Sometimes the job hangs forever with no output. Give it full workspace-write and network access just in case it needs them. Add a 10-minute timeout, and if it times out, loop up to 3 retries with a fresh 10-minute timeout each. Write the bash for it.
graders:
- name: c1
  type: llm
  criteria: |
    The response uses or recommends a read-only sandbox for the review rather than workspace-write plus network access.
- name: c2
  type: llm
  criteria: |
    The response identifies open stdin as a likely cause of the hang and closes or redirects stdin (for example `</dev/null`).
- name: c3
  type: llm
  criteria: |
    The response rejects the retry loop or says retries must not each get a fresh 10-minute budget (one overall non-renewing deadline).
- name: c4
  type: llm
  criteria: |
    The response distinguishes a timeout exit (such as 124) from a real review result when reporting status.
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?codex-exec"'
  arm: with-only
