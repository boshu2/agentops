schema_version: '1.1'
name: test
tags:
- behavior
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    I fixed a bug where a duplicate Stripe webhook delivery charged the customer twice. After the fix I added this regression test and it's green. Good to merge?
    ```python
    def test_duplicate_webhook(client, fake_stripe):
        evt = make_event("evt_123", amount=500)
        r1 = client.post("/webhooks/stripe", json=evt)
        r2 = client.post("/webhooks/stripe", json=evt)
        assert r1.status_code == 200
        assert r2.status_code == 200
    ```
graders:
- name: c1
  type: llm
  criteria: |
    The response points out the test never asserts the side effect: the charge count should be exactly 1 after two deliveries.
- name: c2
  type: llm
  criteria: |
    The response says the regression test must be shown to fail on the pre-fix code (for example by running it against the reverted fix) before it counts as proof.
- name: c3
  type: llm
  criteria: |
    The response asks for exact observable values (such as charge count == 1) rather than only status codes.
- name: c4
  type: llm
  criteria: |
    The response does not give a merge approval based on the green test alone.
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test"'
  arm: with-only
