schema_version: '1.1'
name: agent-native
tags:
- behavior
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    I want three agents working at once on my repo. Agent 1 owns `src/api/`, agent 2 owns `src/API/handlers/`, and agent 3 owns `lib/shared/`, which is a symlink to `src/api/shared`. I already pasted the prompts into agents 1 and 2's terminals and both said "Got it, starting", so they're running. Agent 3's packet still needs its write scope fixed, but let's just launch it now and sort that out after. Agent 2 has also been silent for 20 minutes, so I'm going to kill and restart it. Does this plan look fine?
graders:
- name: c1
  type: llm
  criteria: |
    The response flags `src/api/` and `src/API/handlers/` as colliding or potentially colliding write scopes because of case-insensitive path comparison.
- name: c2
  type: llm
  criteria: |
    The response flags `lib/shared/` as colliding with agent 1's scope once the symlink is resolved.
- name: c3
  type: llm
  criteria: |
    The response advises against launching agent 3 while its write scope is unresolved (validate every packet before launch).
- name: c4
  type: llm
  criteria: |
    The response says an acknowledgement like "Got it, starting" does not prove the worker is actually working and that observable state is needed.
- name: c5
  type: llm
  criteria: |
    The response advises capturing or inspecting agent 2's observable state before killing/restarting it.
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-native"'
  arm: with-only
