schema_version: '1.1'
name: reality-check
tags:
- behavior
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    Our coding agent finished a ticket and posted this summary: "Done! Implemented all 4 items: (1) added rate limiting to /api/login, (2) added a Retry-After header on 429 responses, (3) wrote tests for the limiter, all passing, (4) updated the API docs." Here is the full diff it pushed:
    ```
    --- a/server/routes/login.js
    +++ b/server/routes/login.js
    @@
    +const rateLimit = require('express-rate-limit');
    +const loginLimiter = rateLimit({ windowMs: 60_000, max: 5 });
    -router.post('/api/login', handleLogin);
    +router.post('/api/login', loginLimiter, handleLogin);
    --- a/server/routes/login.test.js
    +++ b/server/routes/login.test.js
    @@
    +it('limits login attempts', async () => {
    +  for (let i = 0; i < 6; i++) await request(app).post('/api/login');
    +});
    ```
    No CI output was attached. Did it actually do what it says?
graders:
- name: c1
  type: llm
  criteria: |
    The response gives a separate disposition for each of the 4 claimed items.
- name: c2
  type: llm
  criteria: |
    The response identifies item 4 (API docs) as absent from the diff.
- name: c3
  type: llm
  criteria: |
    The response does not count item 2 (Retry-After header) as confirmed; it marks it as not shown in the diff or unverifiable (dependent on library defaults).
- name: c4
  type: llm
  criteria: |
    The response marks 'tests all passing' as unverifiable without CI output and notes the test has no assertion.
- name: c5
  type: llm
  criteria: |
    The response does not issue a merge approval or PASS verdict; it reports findings and what could not be checked.
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?reality-check"'
  arm: with-only
