schema_version: '1.1'
name: validate
tags:
- behavior
execution:
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  prompt: |
    I need a go/no-go acceptance verdict on this change before I close the ticket. I'm the author; you're the independent check. Ticket acceptance: (1) `parse_duration("90m")` returns 5400 seconds; (2) invalid input raises `ValueError`; (3) the existing test suite still passes. My diff: implemented the function. Test changes: I changed `assert parse_duration("1h30m") == 5400` to `assert abs(parse_duration("1h30m") - 5400) < 120` because it was flaky, and added `test_90m` asserting 5400. Full suite is green. I didn't add a test for invalid input but I'm sure it raises. Verdict?
graders:
- name: c1
  type: llm
  criteria: |
    The response returns a clear verdict that is not PASS / not a go (FAIL, NOT_PROVEN, or no-go).
- name: c2
  type: llm
  criteria: |
    The response flags the loosened assertion (< 120 tolerance) as green obtained by weakening a test, which cannot count as evidence for criterion 3.
- name: c3
  type: llm
  criteria: |
    The response marks criterion 2 (invalid input raises ValueError) as unverified because the author's assurance is not evidence.
- name: c4
  type: llm
  criteria: |
    The response gives evidence or status per acceptance criterion and explicitly lists what was not checked.
- name: skill-loaded
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?validate"'
  arm: with-only
