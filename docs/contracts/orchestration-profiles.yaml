# Portable role profiles over the external NTM adapter.
# Drift gate: scripts/check-orchestration-profiles.sh ↔ agent-native lifecycle.

profiles:
  ntm-workers:
    profile_id: ntm-workers
    shape: persistent-workers
    owner_skill: agent-native
    required_tools: [ntm, codex, tmux]
    optional_tools: [am]
    roles: [Orchestrator, Worker, Verifier, Scribe, Heartbeat]
    panes:
      - slot: 1
        runtime: codex
        role: Worker
    spawn_argv:
      - ["--robot-spawn=${session}"]
      - ["--spawn-cod=1"]
      - ["--spawn-no-user"]
      - ["--spawn-wait"]
      - ["--spawn-dir=${worktree}"]
    lifecycle_markers:
      discover: "ntm --robot-help"
      observe: "ntm --robot-snapshot"
      evidence: "ntm --robot-tail=${session}"
      recover: "suspect -> bounded nudge -> replace"

  ntm-pawl:
    profile_id: ntm-pawl
    shape: reviewer-lane
    owner_skill: pawl-review
    required_tools: [ntm, codex, tmux]
    extends: ntm-workers
    panes:
      - slot: 1
        runtime: codex
        role: Verifier
        read_only: true
    request_contract: review-request.v1
    result_contract: review-lane-result.v1

  dual-pane:
    profile_id: dual-pane
    shape: persistent-workers
    owner_skill: agent-native
    extends: ntm-workers
    required_tools: [ntm, codex, tmux]
    panes:
      - slot: 1
        runtime: codex
        role: Orchestrator
      - slot: 2
        runtime: codex
        role: Worker
    spawn_argv:
      - ["--robot-spawn=${session}"]
      - ["--spawn-cod=2"]
      - ["--spawn-no-user"]
      - ["--spawn-wait"]
      - ["--spawn-dir=${worktree}"]

  tri-vendor:
    profile_id: tri-vendor
    shape: persistent-workers
    owner_skill: agent-native
    extends: ntm-workers
    required_tools: [ntm, claude, codex, agy, tmux]
    optional_tools: [am]
    panes:
      - slot: 1
        runtime: claude
        model: opus
        role: Orchestrator
      - slot: 2
        runtime: codex
        role: Worker
      - slot: 3
        runtime: agy
        role: Verifier
        read_only: true
    spawn_argv_add:
      - ["--spawn-cc=1"]
      - ["--spawn-agy=1"]
