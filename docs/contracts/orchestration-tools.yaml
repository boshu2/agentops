# External orchestration adapter matrix.
# Gate: scripts/check-orchestration-contracts.sh

version_floors:
  ntm:
    min_version: "1.18.3"
    note: "Probe the installed external binary at runtime; executable contract wins."
  am:
    min_version: "0.3.10"
    note: "Probe am capabilities --json before coordination writes."

tools:
  - id: ntm
    binary: ntm
    probe_args: ["--robot-help"]
    required_for: [ntm-workers, ntm-pawl, dual-pane, tri-vendor]
    ownership: external
  - id: am
    binary: am
    probe_args: ["capabilities", "--json"]
    required_for: [coordinated-writers]
    optional: true
    ownership: external
  - id: codex
    binary: codex
    probe_args: ["--version"]
    required_for: [ntm-workers, ntm-pawl, dual-pane, tri-vendor]
  - id: claude
    binary: claude
    probe_args: ["--version"]
    required_for: [tri-vendor]
  - id: agy
    binary: agy
    probe_args: ["--version"]
    required_for: [tri-vendor]
  - id: tmux
    binary: tmux
    probe_args: ["list-sessions"]
    required_for: [ntm-workers, ntm-pawl, dual-pane, tri-vendor]
