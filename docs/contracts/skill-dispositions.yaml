# Skill dispositions — canonical per-skill DDD/disposition data
#
# Source of truth for the Full Skill Map in
# docs/reference/agentops-skill-domain-map.md.  That .md file is
# regenerated from this yaml + skills/*/SKILL.md frontmatter by
# scripts/generate-skill-domain-map.sh.  Do not hand-edit the table in
# the .md file — edit this yaml and regenerate.
#
# Phase 3 of soc-zxia (registries-drift remediation).
#
# Schema per row:
#   skill           skill slug (matches skills/<slug>/SKILL.md name)
#   domain          "BC<n> <Name>" — must match docs/contracts/bounded-contexts.yaml
#   hexagonal_role  domain | driving-adapter | driven-adapter | supporting | generic
#                   (must match the skill's SKILL.md frontmatter hexagonal_role)
#   disposition     keep | update | refactor | merge-review | cut-review
#   rationale       one-line justification for the disposition

# Historical terminal-state rows — skills whose dirs are ALREADY ABSENT from
# the repo when their ledger row was written, recorded here for history with
# no removal precondition.  Ledger-wide policy: "resolve" means flipping a row
# to a terminal state (merged-into: <target> / cut, with date) — rows are
# NEVER removed (matches docs/plans/skill-prune-phase2.md final-pass step 2).
#
# This is a separate top-level mapping (NOT part of `dispositions:`) because:
#   - scripts/generate-skill-domain-map.sh errors on any dispositions row
#     whose skills/<slug>/ dir does not exist, and
#   - scripts/lib/sku_catalog.py's flat-shape line parser only tracks
#     `- skill:` items, so it skips this section (it precedes `dispositions:`
#     deliberately — keep it ABOVE that key so stray field regexes can never
#     attach to the last list item).
#
# Schema per row:
#   state        terminal state: merged-into | cut
#   merged-into  target skill slug (when state is merged-into)
#   date         date the terminal state was reached
#   rationale    one-line historical justification
