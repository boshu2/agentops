# Workflow dispositions — Claude Workflow scripts (.claude/workflows/*.js), the
# deterministic multi-agent orchestration layer. These are NOT skills: they are
# a SEPARATE artifact kind (kind: workflow), registered here so the
# workflow-governance gate (scripts/check-workflow-governance.sh) can assert
# every .claude/workflows/*.js has a ledger entry.
#
# This is a separate top-level mapping (NOT part of `dispositions:`) for the same
# reason `historical:` is: the `- skill:` line-parsers (scripts/lib/sku_catalog.py
# regex `^\s*-\s+skill:`, scripts/generate-skill-domain-map.sh `.get("dispositions")`)
# only read the `dispositions:` list, so a top-level `workflows:` mapping is
# skipped exactly like `historical:` — it does NOT change the skill COUNT.
#
# Schema per entry:
#   id              workflow id (matches meta.name in the .js)
#   kind            always "workflow"
#   domain          "BC<n> <Name>" — must match docs/contracts/bounded-contexts.yaml
#   hexagonal_role  driving-adapter (workflows orchestrate; they drive the loop)
#   runtime_targets which runtimes can run it (Claude Workflow engine today)
#   parity_policy   exempt — workflows are not subject to the cross-runtime skill parity gate
#   aliases         prior/alternate names that must keep resolving (additive-rename safety)
#   path            the canonical .js path
