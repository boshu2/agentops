# Claim Registry — curated policy overlay for AgentOps claim-evidence bindings.
#
# What may be cited at which strength. Runtime bindings stay in ClaimEvidencePort
# / ao claim bind / .agents/findings/; this file is the policy overlay.
#
# Additive regen: scripts/regen-claim-registry.sh scans agentops:claim:* markers
# and adds UNPROVEN stubs for any missing IDs. It NEVER overwrites curated
# tier / evidence / owner / notes fields.
#
# Schema: schemas/claim-registry.v1.schema.json
# Policy: docs/contracts/claim-eval-promote.md

version: "1"

tiers:
  UNPROVEN:
    description: "Claim exists in source but has no supporting evidence."
    cite_allowed: ["docs/comparisons/**", "docs/wiki-for-agents.md"]
  PILOT:
    description: "Claim has at least one evidence artifact tracked on main."
    cite_allowed: ["docs/**", "GOALS.md"]
  NULL:
    description: "Claim was tested and the null hypothesis was not rejected."
    cite_allowed: ["docs/evals/**"]
  PROVEN:
    description: "Claim has a passing eval binding and tracked evidence on main."
    cite_allowed: ["**"]

