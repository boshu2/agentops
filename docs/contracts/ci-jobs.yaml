# CI jobs manifest — source of truth for the generated jobs table in
# docs/CI-CD.md (rendered by scripts/generate-ci-jobs-table.sh) and parity-
# gated by scripts/validate-ci-policy-parity.sh.
#
# One entry per purpose-grouped job in .github/workflows/validate.yml's
# summary.needs (the `changes` path-filter and `summary` aggregator are
# excluded). Wave 2 collapsed the purpose-job fan-out: Go gate shadow is the
# CI backstop authority; correctness + security remain as complementary lanes.
jobs:
- name: go-gate-shadow
  reason: Runs the ordinary Go gate registry with workflow-coverage reporting
  failure: A deterministic check failure or workflow/registry coverage mismatch
- name: correctness
  reason: Builds `ao`; runs Go, schema, generated-surface, shell, and smoke tests
  failure: Compilation, test, schema, generated-drift, or portability failure
- name: security
  reason: Runs secret, dependency, static-analysis, and dangerous-pattern checks
  failure: A blocking security finding
