# CI jobs manifest — source of truth for the AGENTS-CI.md "### CI Jobs and What
# They Check" table (rendered by scripts/generate-ci-jobs-table.sh) and parity-
# gated by scripts/validate-ci-policy-parity.sh.
#
# One entry per purpose-grouped job in .github/workflows/validate.yml's
# summary.needs (the `changes` path-filter and `summary` aggregator are
# excluded). The 2026-05-28 first-principles rebuild (ag-877/ag-5ck) collapsed
# 67 fine-grained jobs into these purpose groups; each job runs its family of
# scripts/{check,validate}-* as path-gated steps, with advisory checks marked
# `continue-on-error: true` at the step level (so no job is whole-job
# non-blocking). Design: spec/teardown-2026-05-28/gate-rebuild-first-principles.md
jobs:
- name: correctness
  reason: '`ao` builds (Linux + native Windows smoke via matrix); Go tests pass with `-race`/coverage floor; embedded lib/skills in sync; Go complexity budget; CLI + v2.18 integration; release smoke; JSON-flag consistency; bats; Python smoke; advisory `ao doctor` dead-reference check'
  failure: Build/test failure, race, coverage-floor regression, embedded drift, a function exceeding cyclomatic complexity 25, integration/smoke/bats/JSON-flag breakage, or Windows-smoke regression
- name: lint
  reason: ShellCheck (error severity) on all `.sh`, markdownlint on docs, and the skill lint suite (`tests/skills/run-all.sh`)
  failure: Unquoted shell variables, markdown formatting regressions, or a skill-lint rule violation
- name: security
  reason: No hardcoded secrets or dangerous patterns (`curl|sh`, `rm -rf /`); unified security toolchain gate (`scripts/security-gate.sh --mode quick`) — gosec, golangci-lint, gitleaks, trivy, semgrep — blocking on any CRITICAL/HIGH finding
  failure: Hardcoded API keys/passwords in non-test files, a dangerous pattern, or a CRITICAL/HIGH security/quality finding
- name: skill-gates
  reason: Consolidated skill-authoring gate surface (ag-87sv) — structural heal (`--strict`), SKILL.md schema + v2 frontmatter, skill-body command/flag refs resolve against the live CLI, skill-flow connectivity + closed `consumes` vocabulary, scenario↔test linkage (`@covered-by`), and the six-surface derived-artifact drift sweep (`scripts/regen-all.sh --check`)
  failure: A SKILL.md schema/frontmatter violation, a stranded skill-body command/flag ref, a skill-flow connectivity break, an unlinked Gherkin scenario, or six-surface derived-artifact drift (`regen-all.sh --check`)
- name: skills-integrity
  reason: Skill dependencies resolve, headless-runtime skills, manifests valid against versioned schemas, no symlinks, local-only `.agents/`, plugin directory structure
  failure: An unresolved skill dependency, a symlink, or invalid plugin/manifest structure
- name: contracts-sync
  reason: Every derived artifact is in sync — `registry.json`, CLI docs, context map, skill-domain map, SKU catalog, skill catalog (advisory), bounded-contexts, embedded lib/skills, CI policy parity, contract compatibility + next-work parity, contracts structural floor — plus the official AgentOps contract canaries
  failure: Editing a source (skill/CLI/contract) without regenerating its derived artifact, a contract-compat break, or a contract canary regression
- name: codex-parity
  reason: Codex runtime sections, generated artifacts, backbone prompts, override coverage, RPI contract, lifecycle guards, and parity drift (GOALS.md directive D7). `skills-codex/` is manually maintained — audit drift with `scripts/audit-codex-parity.sh`
  failure: A Codex runtime/artifact/contract/parity drift between `skills/` and the manually-maintained `skills-codex/`
- name: doctrine-proof
  reason: Flywheel/goals/wiring/corpus/finding-registry/memrl/sovereignty/three-gap proofs PLUS spec-linkage — executable-spec link integrity (`ao goals scenarios --lint`), AGENTS.md tiered split, docs↔learning references (scenario↔test linkage moved to `skill-gates`)
  failure: A failing GOALS/doctrine proof gate, a broken directive↔scenario link, an AGENTS.md split-contract violation, or a dangling docs↔learning reference
- name: eval
  reason: Eval baseline-audit drift-only gate (`stale_suite_hashes>0`), eval-skill-delta dry-run, workbench golden state (D10 delta), and offline retrieval-quality bench + comparison smoke
  failure: A promoted baseline's suite SHA drift, broken delta/harness infrastructure, a workbench golden-state regression, or a retrieval-quality regression
- name: process-hygiene
  reason: Doc-release stabilization (skill counts + links), `tests/_quarantine/` empty (D3), test-count non-regression ratchet, file-manifest overlap self-test, plus advisory test-staleness, swarm-evidence, and Evidence-line lint
  failure: Skill-count drift, a non-empty quarantine, a net per-package test-count decrease without a `Test-Removal-Reason:` trailer, or a manifest-overlap regression
