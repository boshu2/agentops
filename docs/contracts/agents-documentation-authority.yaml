        - scripts/validate-agents-split.sh
        - tests/docs/mkdocs-strict-allowlist.txt
        - tests/scripts/validate-agents-split.bats

  - path: README.md
    tracked: true
    class: public-entrypoint
    disposition: retain-and-tighten
    owner: README.md
    proof: docs/contracts/entry-documentation-behavior.md plus fresh-context verdicts

  - path: PRODUCT.md
    tracked: true
    class: product-contract
    disposition: retain-and-tighten
    owner: PRODUCT.md
    proof: scripts/check-docs-demoted-claims.sh

  - path: GOALS.md
    tracked: true
    class: fitness-contract
    disposition: retain-and-tighten
    owner: GOALS.md
    proof: ao goals validate --json

  - path: CHANGELOG.md
    tracked: true
    class: release-history
    disposition: retain-historical
    owner: CHANGELOG.md
    proof: tests/docs/validate-doc-release.sh

  - path: PROGRAM.md
    tracked: true
    class: machine-consumed-controller-contract
    disposition: retain-until-consumers-migrate
    owner: PROGRAM.md
    proof: cli/internal/autodev

  - path: MEMORY.md
    tracked: true
    class: machine-consumed-memory-projection
    disposition: retain-until-consumers-migrate
    owner: MEMORY.md
    proof: factual path and consumer audit

  - path: PRACTICE-REGISTRY.md
    tracked: true
    class: machine-consumed-practice-registry
    disposition: retain-until-structured-owner-exists
    owner: PRACTICE-REGISTRY.md
    proof: scripts/validate-practice-citations.sh

  - path: PRE-REDUCTION-SNAPSHOT.md
    tracked: true
    class: dated-snapshot
    disposition: delete-after-zero-consumer-proof
    owner: git-history
    proof: factual zero-reference check plus agent disposition judgment
    references:
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: zero}
      consumers: []

  - path: REDUCTION.md
    tracked: true
    class: completed-migration-plan
    disposition: delete-after-zero-consumer-proof
    owner: docs/contracts/ao-mto-seam.md
    proof: factual zero-reference check plus agent disposition judgment
    references:
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: zero}
      consumers:
        - PRE-REDUCTION-SNAPSHOT.md

  - path: SYSTEM.md
    tracked: true
    class: duplicate-system-map
    disposition: migrate-then-delete
    owner: docs/architecture/operating-loop.md
    proof: factual reference check plus fresh-context migration verdict
    references:
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: zero}
      consumers:
        - docs/CLEANUP-distill-to-core.md
        - scripts/dynamo-e2e.sh

  - path: release-notes.md
    tracked: false
    presence: optional-generated
    class: ignored-generated-runtime-output
    disposition: preserve-outside-repository-cleanup
    owner: scripts/extract-release-notes.sh
    proof: tests/docs/validate-doc-release.sh
