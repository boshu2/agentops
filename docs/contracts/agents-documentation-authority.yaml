schema_version: agentops-documentation-authority.v1
status: active

# This contract records judgments; it does not make them. The checker validates
# only filesystem/index facts and literal references, never prose meaning.
scope:
  root_markdown_count: 10
  reference_excludes:
    - glob: .agents/rpi/**
      reason: generated runtime evidence
    - glob: docs/releases/**
      reason: immutable release history
    - glob: docs/plans/**
      reason: historical planning records
    - glob: docs/audits/**
      reason: point-in-time audit evidence
    - glob: docs/provenance/**
      reason: append-only provenance evidence
    - glob: docs/handoffs/**
      reason: historical session handoffs
    - glob: spec/teardown-2026-05-28/**
      reason: archived teardown specification
    - glob: CHANGELOG.md
      reason: immutable release history

documents:
  - path: AGENTS.md
    tracked: true
    class: operating-contract
    disposition: rewrite
    owner: AGENTS.md
    proof: docs/contracts/agents-operating-contract.md plus fresh-context verdicts
    references:
      include_globs: [cli/AGENTS.md]
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: exact}
      consumers: [cli/AGENTS.md]

  - path: CLAUDE.md
    tracked: true
    class: compatibility-adapter
    disposition: retain-or-replace-with-import-shim
    owner: AGENTS.md
    proof: factual symlink check plus fresh-context verdicts
    references:
      include_globs: [cli/cmd/ao/provenance_add.go]
      phase_policy: {inventory: zero, pre-cutover: zero, cutover: zero}
      consumers: []

  - path: README.md
    tracked: true
    class: public-entrypoint
    disposition: retain-and-tighten
    owner: README.md
    proof: docs/contracts/entry-documentation-behavior.md plus fresh-context verdicts

  - path: PRODUCT.md
    tracked: true
    class: product-contract
    disposition: retain-and-tighten
    owner: PRODUCT.md
    proof: scripts/check-docs-demoted-claims.sh

  - path: GOALS.md
    tracked: true
    class: fitness-contract
    disposition: retain-and-tighten
    owner: GOALS.md
    proof: ao goals validate --json
    references:
      include_globs: [cli/cmd/ao/goals.go]
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: exact}
      consumers: [cli/cmd/ao/goals.go]

  - path: CHANGELOG.md
    tracked: true
    class: release-history
    disposition: retain-historical
    owner: CHANGELOG.md
    proof: tests/docs/validate-doc-release.sh plus pre-push CHANGELOG byte-sync
    references:
      include_globs: [docs/CHANGELOG.md]
      phase_policy: {inventory: zero, pre-cutover: zero, cutover: zero}
      consumers: []

  - path: PROGRAM.md
    tracked: true
    class: machine-consumed-controller-contract
    disposition: retain-until-consumers-migrate
    owner: PROGRAM.md
    proof: cli/internal/autodev
    references:
      include_globs: [cli/internal/autodev/program.go]
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: exact}
      consumers: [cli/internal/autodev/program.go]

  - path: MEMORY.md
    tracked: true
    class: machine-consumed-memory-projection
    disposition: retain-until-consumers-migrate
    owner: MEMORY.md
    proof: factual path and consumer audit
    references:
      include_globs: [cli/cmd/ao/memory.go]
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: exact}
      consumers: [cli/cmd/ao/memory.go]

  - path: PRACTICE-REGISTRY.md
    tracked: true
    class: machine-consumed-practice-registry
    disposition: retain-until-structured-owner-exists
    owner: PRACTICE-REGISTRY.md
    proof: scripts/validate-practice-citations.sh
    references:
      include_globs: [scripts/validate-practice-citations.sh]
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: exact}
      consumers: [scripts/validate-practice-citations.sh]

  - path: release-notes.md
    tracked: false
    presence: optional-generated
    class: ignored-generated-runtime-output
    disposition: preserve-outside-repository-cleanup
    owner: scripts/extract-release-notes.sh
    proof: tests/docs/validate-doc-release.sh
    references:
      include_globs: [scripts/extract-release-notes.sh]
      phase_policy: {inventory: exact, pre-cutover: exact, cutover: exact}
      consumers: [scripts/extract-release-notes.sh]
