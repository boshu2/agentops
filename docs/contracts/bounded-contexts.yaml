# Canonical AgentOps bounded contexts. These describe product responsibilities,
# not lifecycle transitions.
bounded_contexts:
  - id: BC1
    name: Evidence
    product_layer: "Optional corpus and provenance"
    responsibility: "Record, retrieve, cite, and inspect factual evidence without changing core outcomes."
    center_of_gravity: [provenance, search, research, learn]
    ports: [EvidenceReaderPort, EvidenceWriterPort, CitationPort]

  - id: BC2
    name: Judgment
    product_layer: "Independent semantic validation"
    responsibility: "Bind acceptance and exact content identity to one fresh independent verdict."
    center_of_gravity: [validate, council, premortem, postmortem]
    ports: [ManifestPort, ValidatorPort, VerdictStorePort]

  - id: BC3
    name: Experiment
    product_layer: "One-pass RPI"
    responsibility: "Shape one behavior, run one bounded experiment, report one verdict, and stop."
    center_of_gravity: [rpi, plan, implement]
    ports: [PlanPort, ImplementPort, ValidatePort]

  - id: BC4
    name: Skills
    product_layer: "Skill mesh"
    responsibility: "Author skills and generate every inventory and graph projection from SKILL.md metadata."
    center_of_gravity: [skill-builder, heal-skill, standards, doc]
    ports: [SkillCatalogPort, SkillProjectionPort]

  - id: BC5
    name: Runtime
    product_layer: "Optional runtime specialists"
    responsibility: "Adapt explicit caller requests to local tools without acquiring lifecycle authority."
    center_of_gravity: [codex-exec, rch, sbh, cc-hooks]
    ports: [RuntimePort, DiagnosticPort]

  - id: BC6
    name: Dispatch
    product_layer: "Optional factory adapters"
    responsibility: "Dispatch explicit disjoint packets once and return per-packet facts."
    center_of_gravity: [ntm, swarm, agent-mail, agent-native]
    ports: [DispatchOncePort, MessagePort]
