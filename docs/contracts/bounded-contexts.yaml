# Canonical AgentOps bounded contexts. These describe product responsibilities,
# not lifecycle transitions.
bounded_contexts:
  - id: BC1
    name: Evidence
    product_layer: "Optional requested proof and provenance"
    responsibility: "Record, retrieve, and cite factual evidence from its owning context sources without changing core outcomes or becoming a second authority."
    center_of_gravity: [provenance, search, research, learn]
    ports: [EvidenceReaderPort, EvidenceWriterPort, CitationPort]

  - id: BC2
    name: Judgment
    product_layer: "Independent semantic validation"
    responsibility: "When the caller asks, a mistake is costly to undo, or no deterministic check covers the change, bind acceptance and exact content identity to one fresh independent verdict; checks and CI gate an ordinary change."
    center_of_gravity: [validate, council, premortem, postmortem]
    ports: [ManifestPort, ValidatorPort, VerdictStorePort]

  - id: BC3
    name: Experiment
    product_layer: "Bounded-repair RPI"
    responsibility: "Shape one behavior, implement it, repair known defects directly and confirm each repair with a check, obtain one fresh read only on the named triggers (the caller asks, a mistake is costly to undo, or no deterministic check covers the change), report one result."
    center_of_gravity: [rpi, plan, implement]
    ports: [PlanPort, ImplementPort, ValidatePort]

  - id: BC4
    name: Skills
    product_layer: "Skill mesh"
    responsibility: "Author skills and generate every inventory and graph projection from SKILL.md metadata."
    center_of_gravity: [skill-builder, standards, doc]
    ports: [SkillCatalogPort, SkillProjectionPort]

  - id: BC5
    name: Runtime
    product_layer: "Optional runtime specialists"
    responsibility: "Adapt explicit caller requests to local tools without acquiring lifecycle authority."
    center_of_gravity: [codex-exec, claude-exec]
    ports: [RuntimePort, DiagnosticPort]

  - id: BC6
    name: Dispatch
    product_layer: "Optional factory adapters"
    responsibility: "Dispatch explicit disjoint packets once and return per-packet facts."
    center_of_gravity: [swarm, agent-native]
    ports: [DispatchOncePort, MessagePort]
