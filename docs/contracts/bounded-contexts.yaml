# Bounded Contexts — canonical definitions
#
# Single source of truth for the 6 bounded contexts that govern AgentOps.
# Read by:
#   - scripts/check-bounded-contexts-drift.sh (verifies registry docs don't
#     drift from these definitions)
#   - generators (Phase 3 of registries-drift remediation, soc-zxia.3)
#
# Schema:
#   id              "BC<n>" identifier used in skill frontmatter and docs
#   name            short noun: Corpus | Validation | Loop | Factory | Runtime
#   product_layer   how this BC shows up in the product (used by skill-domain-map.md)
#   responsibility  one-sentence "what does it do" (used by both registry docs)
#   center_of_gravity  example skills + paths where this BC lives today
#   implemented_ports  exact interfaces present under cli/internal/ports
#   target_ports       reviewed seams not yet implemented
#
# Adding/renaming a BC: edit this file, then run
#   bash scripts/check-bounded-contexts-drift.sh
# to learn which doc tables need their prose updated.

bounded_contexts:
  - id: BC1
    name: Corpus
    product_layer: "Local bookkeeping and experimental context reuse"
    responsibility: "Capture, retrieve, cite, and promote local knowledge and evidence."
    center_of_gravity:
      - ".agents/"
      - post-mortem
      - pattern-mining
      - operationalize
      - "ao wiki"
    implemented_ports:
      - CorpusReaderPort
      - CorpusWriterPort
      - ContextCompilerPort
      - CitationPort
      - FindingCompilerPort
      - FreshnessPolicyPort
      - FrontmatterCodecPort
      - WikiIndexPort
    target_ports: []

  - id: BC2
    name: Validation
    product_layer: "Verification membrane"
    responsibility: "Judge whether plans, code, docs, dependencies, and releases satisfy declared acceptance."
    center_of_gravity:
      - validate
      - council
      - pawl-review
      - gates
      - evals
      - CI scripts
    implemented_ports:
      - GateRunnerPort
      - CIStatusPort
      - SafetyPolicyPort
      - ClaimEvidenceBinderPort
      - ReviewLanePort
    target_ports:
      - ScenarioRunnerPort

  - id: BC3
    name: Loop
    product_layer: "Operating loop"
    responsibility: "Shape intent, execute vertical slices, record evidence, and steer repair to verified done."
    center_of_gravity:
      - evolve
      - rpi
      - discovery
      - plan
      - crank
      - goals
      - beads
      - operating-loop
    implemented_ports:
      - LoopReaderPort
      - LoopWriterPort
      - HypothesisLedgerPort
      - ConvergenceCheckPort
      - CloseoutPort
      - FindingRecurrenceReducerPort
      - PacketRepository
    target_ports:
      - WorkSelectorPort

  - id: BC4
    name: Factory
    product_layer: "Skill and claim factory"
    responsibility: "Build, audit, package, and govern reusable skills, workflows, and claims."
    center_of_gravity:
      - skill-builder
      - heal-skill
      - workflow-builder
      - standards
      - docs
    implemented_ports:
      - ClaimEvidencePort
    target_ports:
      - SkillCatalogPort
      - SkillScorerPort
      - FactoryAdmissionPort

  - id: BC5
    name: Runtime
    product_layer: "Harness and operator adapters"
    responsibility: "Adapt the core loop to harnesses, workspaces, shells, installers, and operator machines."
    center_of_gravity:
      - cli/cmd/ao
      - skills-codex
      - installers
      - push
      - scope
    implemented_ports:
      - HarnessPort
      - WorkspacePort
      - OperatorPort
      - EventBusPort
      - IssueTracker
      - LLMClient
    target_ports:
      - GitPort
      - AgentWorkerPort

  - id: BC6
    name: Orchestration
    product_layer: "Multi-agent orchestration substrate"
    responsibility: "Dispatch and coordinate whole loop units across explicitly selected substrates."
    center_of_gravity:
      - ntm
      - swarm
      - agent-mail
      - using-gc
    implemented_ports:
      - OrchestrationPort
      - AgentMailPort
      - PreflightPort
      - VerifyPort
      - SubstrateProbePort
    target_ports:
      - SwarmDispatchPort
      - ConvergencePort
