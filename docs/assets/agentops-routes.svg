<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img" aria-labelledby="arTitle arDesc">
  <title id="arTitle">AgentOps workflow: native checks, with one fresh review where a mistake is costly</title>
  <desc id="arDesc">Clear accepted intent goes straight to Implement; unclear intent goes to Plan first. Implement runs native checks and CI. Ordinary changes finish on those checks. Use one fresh author-distinct review when requested, when a mistake cannot be cheaply undone, or when no deterministic check covers the changed behavior. An existing change can enter at review. Repair findings within scope and confirm with affected checks; another review requires a caller request. NOT_PROVEN reports missing evidence without claiming PASS. The optional learning loop sends a result to a protected draft, fresh support and disclosure review, reviewed .context/ pages, and later work.</desc>

  <defs>
    <linearGradient id="arPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0b08"/>
      <stop offset="100%" stop-color="#070605"/>
    </linearGradient>
    <filter id="arGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <marker id="arArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="960" height="790" fill="#070a08"/>

  <!-- drawing strip -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="30" y="36" font-size="20" letter-spacing="1.5" fill="#b78318">AGENTOPS WORKFLOW</text>
    <text x="930" y="36" text-anchor="end" font-size="20" fill="#8a8378">ENTER ANYWHERE</text>
  </g>
  <line x1="30" y1="52" x2="930" y2="52" stroke="#f59e0b" stroke-opacity="0.22"/>

  <rect x="70" y="110" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="190" y="146" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e8e4dd">Intent</text>
  <rect x="350" y="215" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="470" y="251" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e8e4dd">Plan</text>
  <rect x="70" y="320" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="190" y="356" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e8e4dd">Implement</text>
  <rect x="70" y="425" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="190" y="461" text-anchor="middle" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#e8e4dd">Native checks + CI</text>
  <rect x="350" y="425" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="470" y="461" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e8e4dd">Existing change</text>
  <rect x="70" y="535" width="520" height="84" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="330" y="571" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#fbbf24">One fresh review</text>
  <text x="330" y="600" text-anchor="middle" font-family="ui-monospace, monospace" font-size="17" fill="#b78318">requested / hard to undo / uncovered</text>
  <rect x="70" y="690" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="190" y="726" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#e8e4dd">Repair + checks</text>
  <rect x="350" y="690" width="240" height="60" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.7"/>
  <text x="470" y="726" text-anchor="middle" font-family="ui-monospace, monospace" font-size="22" font-weight="700" fill="#fbbf24">Finish</text>
  <g fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#arArrow)">
    <path d="M190 170 V318"/>
    <path d="M310 140 H470 V213"/>
    <path d="M470 275 V350 H312"/>
    <path d="M190 380 V423"/>
    <path d="M190 485 V533"/>
    <path d="M470 485 V533"/>
    <path d="M310 455 H330 V402 H640 V720 H592"/>
    <path d="M190 619 V688"/>
    <path d="M470 619 V688"/>
    <path d="M310 720 H348"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="17" fill="#b78318">
    <text x="202" y="238">clear,</text>
    <text x="202" y="264">accepted</text>
    <text x="370" y="128">unclear</text>
    <text x="482" y="318">settled</text>
    <text x="202" y="517">when costly</text>
    <text x="202" y="660">findings</text>
    <text x="482" y="660">accepted</text>
    <text transform="translate(660 596) rotate(-90)" text-anchor="middle">ordinary: checks + CI</text>
    <text x="70" y="781" font-size="15">One round. NOT_PROVEN reports gaps; re-review on request.</text>
  </g>
  <!-- ===== optional learning loop ===== -->
  <rect x="680" y="66" width="250" height="692" rx="8" fill="none" stroke="#f59e0b" stroke-opacity="0.45" stroke-dasharray="3 5"/>
  <g font-family="'JetBrains Mono', ui-monospace, monospace">
    <text x="696" y="100" font-size="20" font-weight="700" letter-spacing="1" fill="#fbbf24">LEARNING LOOP</text>
    <text x="696" y="126" font-size="20" fill="#8a8378">optional</text>
  </g>

  <g font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">
    <rect x="696" y="146" width="218" height="78" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="805" y="180" font-size="22" font-weight="700" fill="#e8e4dd">Result</text>
    <text x="805" y="208" font-size="20" fill="#b78318">of any route</text>

    <rect x="696" y="270" width="218" height="78" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="805" y="304" font-size="22" font-weight="700" fill="#e8e4dd">Protected draft</text>
    <text x="805" y="332" font-size="20" fill="#b78318">outside Git</text>

    <rect x="696" y="394" width="218" height="100" rx="7" fill="url(#arPanel)" stroke="#fbbf24" stroke-opacity="0.8"/>
    <text x="805" y="428" font-size="22" font-weight="700" fill="#fbbf24">Fresh review</text>
    <text x="805" y="456" font-size="20" fill="#b78318">support +</text>
    <text x="805" y="480" font-size="20" fill="#b78318">disclosure</text>

    <rect x="696" y="540" width="218" height="78" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="805" y="574" font-size="22" font-weight="700" fill="#e8e4dd">.context/</text>
    <text x="805" y="602" font-size="20" fill="#b78318">reviewed pages</text>

    <rect x="696" y="664" width="218" height="78" rx="7" fill="url(#arPanel)" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="805" y="698" font-size="22" font-weight="700" fill="#e8e4dd">Later work</text>
    <text x="805" y="726" font-size="20" fill="#b78318">queries it</text>
  </g>

  <g fill="none" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#arArrow)">
    <line x1="805" y1="224" x2="805" y2="268"/>
    <line x1="805" y1="348" x2="805" y2="392"/>
    <line x1="805" y1="494" x2="805" y2="538"/>
    <line x1="805" y1="618" x2="805" y2="662"/>
  </g>
</svg>
