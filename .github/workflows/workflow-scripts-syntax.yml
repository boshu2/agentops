name: workflow-scripts-syntax

# S7: durable regression gate for the Claude Code Workflow-tool scripts under
# workflows/ (the tracked canonical source). Plain JS run by the harness; a parse
# catches syntax breakage that would otherwise only surface at invocation time.
# The harness runs a script as an async function body after its `export const
# meta` header, so top-level `await` and `return` are legal there. Parse it the
# same way: `node --check` reads the file as an ES module and rejects the
# top-level `return` every active workflow ends with.
# Isolated from validate.yml on purpose (no shared job registry to drift).

on:
  pull_request:
    paths:
      - 'workflows/*.js'
      - '.github/workflows/workflow-scripts-syntax.yml'
  workflow_dispatch:

jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: parse every workflow script as the harness runs it
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(workflows/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow scripts to check."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "checking $f"
            node -e '
              const file = process.argv[1]
              const source = require("node:fs").readFileSync(file, "utf8")
              if (!source.startsWith("export const meta = {")) {
                console.error(file + ": must begin with export const meta = {")
                process.exit(1)
              }
              const AsyncFunction = (async function () {}).constructor
              try {
                // Constructing the function parses the body without running it.
                new AsyncFunction(source.slice("export ".length))
              } catch (error) {
                console.error(file + ": " + error.message)
                process.exit(1)
              }
            ' "$f"
          done
          echo "All ${#files[@]} workflow script(s) parse cleanly."
