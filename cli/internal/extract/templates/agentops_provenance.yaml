language: en
name: agentops_provenance
type: graph
tags:
  - provenance
  - prov-o
  - agentops
description: >-
  The first real AgentOps extraction template targeting OUR PROV-O provenance
  vocabulary (cli/internal/provenancegraph, schemas/agentops-sdlc-provenance.v1).
  Extract decisions, findings, learnings, artifacts, and beads from AgentOps
  session exhaust, plus the W3C PROV-O edges between them, into real traversable
  graph relations rather than prose.
output:
  entities:
    - name: node_type
      type: string
      description: >-
        The kind of node. One of: decision, finding, learning, artifact, bead.
        (decision/artifact/bead/learning map directly onto provenancegraph node
        types; 'finding' is an AgentOps corpus concept extracted as an artifact
        node at graph-write time — see the agentops_provenance_test.go decision
        note. node_type is NOT validated by the extraction-template schema; the
        graph writer enforces the closed provenancegraph.NodeTypes set.)
      required: true
    - name: id
      type: string
      description: Stable identifier for the node (bead id, file path, decision slug).
      required: true
    - name: summary
      type: string
      description: One-line human description of the node.
      required: false
  relations:
    - name: from_id
      type: string
      description: Source node id (the subject of the PROV-O statement).
      required: true
    - name: relation
      type: string
      description: >-
        A W3C PROV-O verb naming the edge. MUST be one of the closed
        provenancegraph.Relations set: wasGeneratedBy, wasAssociatedWith,
        wasDerivedFrom, wasInformedBy, wasAttributedTo, wasInfluencedBy,
        wasRevisionOf, wasInvalidatedBy. No colloquial or AgentOps-local verb
        (e.g. derives_from, artifact_derived_from) is permitted — use the PROV-O
        term (e.g. wasDerivedFrom).
      required: true
    - name: to_id
      type: string
      description: Target node id (the object of the PROV-O statement).
      required: true
guideline: >-
  Read the AgentOps session exhaust (plans, decisions, commits, beads, verdicts,
  learnings) and extract ONLY nodes and edges supported by explicit evidence in
  the text. Emit each node once with a stable id and its node_type. For every
  edge, choose the single most specific W3C PROV-O verb from the closed set
  (wasGeneratedBy, wasAssociatedWith, wasDerivedFrom, wasInformedBy,
  wasAttributedTo, wasInfluencedBy, wasRevisionOf, wasInvalidatedBy): use
  wasGeneratedBy for a decision producing an artifact, wasDerivedFrom for an
  artifact derived from another artifact, wasInvalidatedBy when a learning
  supersedes a prior decision, and wasInformedBy when a scenario or finding
  informs an artifact. Never invent an edge, and never use a verb outside the
  closed set.
identifiers:
  entity_id: id
  relation_id: '{from}|{relation}|{to}'
