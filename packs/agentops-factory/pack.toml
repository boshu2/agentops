[pack]
name = "agentops-factory"
schema = 2
version = "0.2.0"
requires_gc = ">=1.3.5"
description = "Thin AgentOps role pack over native Gas City routing, formulas, and Beads state."

[[named_session]]
template = "mayor"
scope = "city"
# always: the controller keeps the standing shepherd session live even with no
# ready demand, so a human can attach to it and an agent can `mayor tell` it at
# any time. This is the 3.3 human-and-agent door.
mode = "always"

[[named_session]]
template = "refiner"
scope = "rig"
mode = "on_demand"

[imports.executor]
source = "../agentops-executor"
