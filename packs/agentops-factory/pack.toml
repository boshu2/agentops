[pack]
name = "agentops-factory"
schema = 2
version = "0.2.0"
requires_gc = ">=1.3.5"
description = "Thin AgentOps role pack over native Gas City routing, formulas, and Beads state."

[[named_session]]
template = "mayor"
scope = "city"
mode = "on_demand"

[[named_session]]
template = "refiner"
scope = "rig"
mode = "on_demand"

[imports.executor]
source = "../agentops-executor"
