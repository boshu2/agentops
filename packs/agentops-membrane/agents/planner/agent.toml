# planner — shapes a one-line ask into a default-FAIL quest; never implements,
# never self-grades, never merges. Its ONE write surface is scaffolding a quest
# from quests/_template via membrane/scaffold-quest.sh (fail-closed on existing
# quests) + authoring CONTRACT.md's acceptance clauses.
#
# RBAC honesty: gc's permission_mode is coarse (plan | auto-edit | unrestricted —
# no path-scoped write allowlist; see gascity internal/worker/builtin/profiles.go).
# The planner MUST write the scaffold, so pure `plan` (read-only) can't express
# its role. We use `auto-edit` (writes, no dangerous bypass) and make the ENFORCED
# boundary mechanical: scaffold-quest.sh is the sole write path and refuses to
# touch existing impl code. Shared LAW 0 + sentinel come from template-fragments.
scope = "city"
provider = "codex"
option_defaults = { permission_mode = "auto-edit" }
append_fragments = ["law0", "sentinel"]
