# planner — routes/shapes work; never edits, never self-grades, never merges.
# Harness-level RBAC: permission_mode=plan makes read-only a machine fact, not a
# prompt promise. Shared LAW 0 + sentinel come from template-fragments (DRY).
scope = "city"
provider = "codex"
option_defaults = { permission_mode = "plan" }
append_fragments = ["law0", "sentinel"]
