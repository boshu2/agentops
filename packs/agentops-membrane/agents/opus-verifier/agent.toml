# opus-verifier — verdict-only reviewer on the CLAUDE family (a FRESH session,
# never the builder session — author!=judge holds via session isolation; the
# quorum's family diversity comes from pairing with the codex lane). The
# membrane FAILOVER lane for LANE2: when the agy/gemini lane is auth-dead or
# unavailable, a city sets [workspace] env MEMBRANE_LANE2_TARGET =
# "agentops-membrane.opus-verifier" / MEMBRANE_LANE2_FAMILY = "claude" so the
# gate keeps >=2 distinct reviewer families ({codex, claude}) instead of
# degrading to one. Same RBAC + sentinel + nonce contract as the other lanes.
# Precedent: the repo pawl-service runs opus+codex panels as its multi-model
# quorum. Restore the agy lane when its auth heals (three families beat two).
scope = "city"
provider = "claude"
option_defaults = { permission_mode = "plan" }
append_fragments = ["law0", "breaker-escalation", "sentinel"]
