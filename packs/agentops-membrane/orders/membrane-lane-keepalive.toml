# membrane-lane-keepalive — the shipped form of RESIDUAL-GAPS.md gap 1.
#
# An idle interactive reviewer pane in `draining` never reaches a safe boundary
# on its own; `gc session submit` is the ONLY verb observed to advance it
# (kill/reset/send-keys all fail — out-of-box gap map + fitness run). This
# order re-submits a no-op keepalive to a membrane LANE (never a builder, never
# the dispatcher) that is draining or inactive past budget, via the pack's
# scripts/lane-keepalive.sh.
#
# Opt-in posture: importing the pack registers the order; a city that does not
# want it overrides/disables it like any order. Interval is deliberately close
# to the default idle budget (5m) so a drained lane loses at most ~one round
# of wall time. Knobs via env: MEMBRANE_LANE_TEMPLATES, MEMBRANE_IDLE_BUDGET_S.
#
# idempotent=true: a submit-only nudge is safe to repeat; the script never
# kills or resets anything (honest limitation: the DURABLE fix is upstream —
# dispatcher-side submit-on-spawn or a headless verifier lane; see
# RESIDUAL-GAPS.md "Honest status").
[order]
description = "Membrane lane keepalive: re-submit a no-op nudge to a reviewer lane that is draining or idle past budget (gc session submit only — the sole verb that drains an idle pane)"
scope = "city"
trigger = "cooldown"
interval = "5m"
exec = "$PACK_DIR/scripts/lane-keepalive.sh"
timeout = "60s"
idempotent = true
