# membrane-canary — the city's own membrane applied to itself, gc-NATIVELY.
#
# This is NOT hand-rolled launchd/cron (forbidden) and NOT a rebuild of stall-
# detection/notification infra (stock gc already ships 20 housekeeping orders +
# gc doctor + events + dashboard — see docs/audits/gc-mvp-2026-07-05). It is a
# stock gc ORDER: the controller runs it on a cooldown, and a non-zero exit
# surfaces through gc's EXISTING events/dashboard channel — we self-monitor via
# the substrate, we don't parallel it.
#
# What it runs: the structural membrane smoke (scripts/e2e.sh) — `gc doctor`'s
# two membrane checks (law0 + membrane-health) must be green and the pack must
# `gc lint`-compile. If the close door is removed, made non-executable, the
# trinity goes missing, or the city drops below 2 provider families, the next
# canary sweep exits non-zero and the failure lands in `gc events`.
#
# SCOPE NOTE (honest): this canary is a STRUCTURAL self-check, not a live
# through-the-loop drill (a real tiny quest run end-to-end needs live agent
# panes — that is age-gc-mvp-w2-nuiw.4, explicitly out of scope here). It proves
# the membrane is DEPLOYABLE-and-SOUND on a schedule; it does not prove a quest
# CONFIRMs. Interval defaults to 30m; override in the city with an [order.env]
# or by copying this order.
#
# Exec orders receive PACK_DIR (this pack's dir), GC_CITY_PATH, GC_BIN-adjacent
# env from the controller (cmd/gc/order_store.go). idempotent=true: a read-only
# health sweep is safe to repeat, so it fails OPEN under store contention rather
# than being starved.
[order]
description = "Membrane self-verification canary: run the structural membrane smoke (law0 + membrane-health doctor checks green, pack compiles) on a schedule"
scope = "city"
trigger = "cooldown"
interval = "30m"
exec = "$PACK_DIR/scripts/e2e.sh --city $GC_CITY_PATH --pack $PACK_DIR --quiet"
timeout = "180s"
idempotent = true
