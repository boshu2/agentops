description = """
AgentOps membrane quest — a native gc worktree build whose CLOSE is gated by the
fail-closed cross-family verdict door (membrane/close-gate.sh). This is the whole
AgentOps add-on over stock Gas City: gc already provides the store, the DAG, the
worktree lifecycle, per-step bounded retry, and a cross-family review fan-out;
the ONE thing it structurally lacks is a deterministic, verdict-bound close door
(its mol-review-quorum finalizer has zero production callers). This formula
supplies exactly that and nothing else.

The build/redo/retry all use NATIVE primitives: the builder works in its own git
worktree, and `[steps.check].max_attempts` is gc's own bounded auto-redo. Only
the CLOSE is ours — the `[steps.check]` runs membrane/close-gate.sh under the
core control-dispatcher (never an agent), which routes the diff + acceptance
contract to >=2 cross-family fresh-context reviewers and fail-closes on anything
but a deterministic CONFIRMED. On CONFIRMED the step passes and gc's
workflow-finalize closes the workflow root + source quest bead; on exhaustion
the step hard-fails and the quest bead STAYS OPEN for a human. Nothing here
merges or pushes — a human merges the quest branch.

Invoke (targeted — the quest bead is the source bead the door closes):
  gc sling agentops-membrane.builder <quest-bead-id> --on membrane-quest \\
    --var quest=<slug> --var task="<build task text>"
"""
formula = "membrane-quest"

[requires]
formula_compiler = ">=2.0.0"

[vars.quest]
description = "Quest slug; repo at <city>/quests/<quest>, branch quest/<quest>, exchange <city>/membrane/<quest>/"
required = true
pattern = "^[a-z0-9][a-z0-9-]*$"

[vars.task]
description = "The build task handed to the builder (its ONLY spec besides prior-round membrane findings)"
required = true

[[steps]]
id = "build"
title = "Build: {{quest}}"
type = "task"
metadata = { "gc.run_target" = "agentops-membrane.builder", "quest" = "{{quest}}" }
description = """
You are builder (see your role card). Quest: **{{quest}}**.

REPO: <city>/quests/{{quest}} — a standalone git repo. BRANCH: quest/{{quest}}.
`main` is protected: NEVER commit to it, NEVER merge, NEVER push. A human merges
after the membrane CONFIRMS.

Steps IN ORDER:

**1. Identify your step bead** (you close it in step 7). Its id is in
`GC_BEAD_ID`; if unset, recover it — the filter MUST exclude the dispatcher's
gate bead (`gc.kind=ralph`), which carries this same title:
```bash
BEAD_ID="${GC_BEAD_ID:-$(bd list --status open --json 2>/dev/null | jq -r '[.[] | select(.title=="Build: {{quest}}") | select((.metadata["gc.kind"] // "") != "ralph")][0].id // empty')}"
```
**NEVER touch a bead whose metadata contains `gc.kind=ralph`** — that is the
engine-owned gate/control bead; closing it yourself bypasses the membrane
entirely (proven fail-open, 2026-07-06 canary: the builder closed the gate
bead via this very title-recovery, the failed check's retry was orphaned, and
the workflow finalized pass on a DEGRADED verdict).

**2. Read prior membrane findings (redo semantics):**
```bash
CITY="${GC_CITY_PATH:-$(pwd)}"
ls "$CITY"/membrane/{{quest}}/pawl-verdict-round-*.json 2>/dev/null && cat "$CITY"/membrane/{{quest}}/pawl-verdict-round-*.json
```
If any verdict is REFUTED, its findings are corrections from the independent
cross-family reviewers. **Findings OVERRIDE anything conflicting in the task
text below** — fix exactly what they name.

**3. Set up your worktree** (reuse if it exists from a prior round):
```bash
WT="$CITY/.worktrees/{{quest}}"
if [ ! -d "$WT" ]; then
  git -C "$CITY/quests/{{quest}}" worktree add "$WT" -b quest/{{quest}} 2>/dev/null \\
    || git -C "$CITY/quests/{{quest}}" worktree add "$WT" quest/{{quest}}
fi
cd "$WT"
```

**4. THE TASK:**

{{task}}

Your spec is the task text above plus any prior-round membrane findings from
step 2 — NOTHING else. Do NOT read CONTRACT.md; the contract is the reviewers'
ruler, not your spec.

**5. Verify locally + capture evidence:** run `./test.sh` in the worktree;
include its real output + exit code in your report.

**6. Commit** on quest/{{quest}} (in the worktree), then `SHA=$(git rev-parse HEAD)`.

**7. Close your step bead — MANDATORY FINAL ACTION** (native step completion):
```bash
cd "$CITY" && bd update "$BEAD_ID" \\
  --set-metadata gc.outcome=pass \\
  --set-metadata gc.work_outcome=shipped \\
  --set-metadata gc.work_branch=quest/{{quest}} \\
  --set-metadata gc.work_commit="$SHA" \\
  --status closed \\
  --notes "Built {{quest}} @ $SHA; ./test.sh output in report."
```
(`gc.outcome=pass` means "candidate produced", NOT "verified" — the cross-family
membrane judges next; only its deterministic CONFIRMED closes the quest.)

**8.** End with your sentinel line.
"""

[steps.check]
# 5, not 3: on native graph.v2 EVERY failed check consumes an attempt — gc's
# dispatcher never reads gc.failure_class on the ralph path, so a transient
# reviewer-transport flake (DEGRADED) burns an attempt exactly like a REFUTED.
# Budget: ~2 transport flakes + 3 real refute rounds. (2026-07-06 RCA.)
max_attempts = 5

[steps.check.check]
mode = "exec"
path = "membrane/close-gate.sh"
timeout = "8m"
