# agentops-membrane — the AgentOps verification membrane as a composable Gas City
# pack. It adds the ONE thing stock gc structurally lacks: a fail-closed,
# verdict-bound close door (deterministic cross-family verdict; no verdict = not
# done). Everything else — the store, the DAG, worktree lifecycle, bounded retry,
# the control-dispatcher, provenance — is stock gc, which this pack RIDES ON and
# never rebuilds. Import into any city with ONE line:
#
#   [imports.agentops-membrane]
#   source = "https://github.com/boshu2/agentops/tree/main/packs/agentops-membrane"
#   version = "sha:<pin>"
#
# The consuming city must already import `core` (for the control-dispatcher that
# runs the [steps.check] close gate). Deployment specifics — which providers the
# verifier lanes use, and declaring them as always-on [[named_session]]s or a
# pool so `gc session submit` can deliver — belong in the city's city.toml (see
# README.md §Deploy). This pack.toml stays deployment-agnostic on purpose.
[pack]
name = "agentops-membrane"
schema = 2
version = "0.1.0"
description = "AgentOps verification membrane: fail-closed, cross-family, verdict-bound close door as a composable gc pack (LAW-0 doctor check, planner/builder/verifier trinity with harness RBAC, membrane-quest formula, deterministic close-gate)."

# Each trinity agent sets scope="city" in its own agents/<name>/agent.toml
# (agent_defaults.scope is not honored in this pack schema wave).
