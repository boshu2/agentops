# AgentOps pack — the reference Gas City coding workflow.
#
# AgentOps roles: mayor (team-lead: orchestrate / merge / notify, human on the
# loop) + refinery (rig-scoped worker that runs the `ao rpi` loop on a bead).
#
# Modeled on: examples/gastown/packs/gastown/pack.toml ([pack] schema=2 +
#   [[named_session]] bindings). gastown imports a sibling maintenance pack;
#   AgentOps does not — the only opinion is the two agents + thin orders.
#
# Referenced by both city.toml [imports.agentops] and the rigs[].imports form:
#   city import   → expands city-scoped agents (mayor)
#   rig import    → expands rig-scoped agents (refinery)

[pack]
name = "agentops"
schema = 2

# THIN-SEAM note: gastown declares a [global].session_live tmux-theme hook here.
# AgentOps deliberately ships no tmux chrome — the opinion is the loop, not the
# terminal. Hook wiring lives in overlay/.claude/settings.json instead.

# The mayor is always-on, city-scoped (team lead / merge authority / human
# liaison). Modeled on gastown pack.toml [[named_session]] template="mayor".
[[named_session]]
template = "mayor"
scope = "city"
mode = "always"

# The worker is rig-scoped, spawned on demand by bead pressure (pool scaling).
# Modeled on gastown pack.toml [[named_session]] template="refinery" on_demand.
[[named_session]]
template = "refinery"
scope = "rig"
mode = "on_demand"
