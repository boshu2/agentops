# evolve-cadence — the OUTER loop. On a cadence, the mayor runs `ao evolve`,
# which selects the next-best work and drives a wave of `ao rpi` cycles toward a
# GOALS.md directive, then post-mortems at the session-scope threshold.
#
# Modeled on: examples/dolt/orders/mol-dog-stale-db.toml (cron formula order:
#   trigger="cron", schedule, pool) + docs/tutorials/07-orders.md cron trigger.
#
# THIN-SEAM (design doc "DDD seam correction"): evolve's CADENCE (recurrence) is
# GC orchestration → a cron Order. evolve's LOGIC (which bead next, N-cycles-
# toward-a-goal, post-mortem) stays inside `ao evolve` — AgentOps owns it. GC
# fires the cadence; AgentOps runs the wave.
#
# This order routes the one-step `evolve-dispatch` formula to the mayor pool
# (a pool-routing order must name a formula — 07-orders.md). The single step
# just runs `ao evolve`.
[order]
description = "Evolve cadence — autonomous improvement wave (was: ao schedule)"
formula = "evolve-dispatch"
trigger = "cron"
schedule = "0 */4 * * *"        # every 4h; tune to inference budget
pool = "mayor"
