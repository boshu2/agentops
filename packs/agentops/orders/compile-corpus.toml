# compile-corpus — recompile the .agents/ corpus (Mine → Grow → Defrag → Lint).
#
# This is the retired scheduled `ao compile` re-expressed as a GC EXEC Order.
#
# Modeled on: examples/gastown/packs/maintenance/orders/gate-sweep.toml (exec
#   order: trigger + exec="$PACK_DIR/assets/scripts/..."). `ao compile` is
#   deterministic, no LLM judgment → exec order (no agent context burned), per
#   the gastown rule "mechanical work = exec orders" (docs/tutorials/07-orders.md).
#
# Exec orders run on the controller, get ORDER_DIR + PACK_DIR in env, and CANNOT
# have a `pool` (07-orders.md). Default exec timeout 300s.
[order]
description = "Recompile the .agents corpus (was: scheduled ao compile)"
trigger = "cooldown"
interval = "6h"
exec = "$PACK_DIR/assets/scripts/ao-compile.sh"
