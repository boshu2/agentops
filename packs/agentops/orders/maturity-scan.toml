# maturity-scan — refresh inject decay-ranking / find stale corpus entries.
#
# This is the retired scheduled `ao maturity --scan` re-expressed as a GC EXEC
# Order. Mechanical (no LLM) → exec order, same rationale as compile-corpus.toml.
#
# Modeled on: examples/dolt/orders/dolt-health.toml (exec order that just runs
#   CLIs inline: `exec = "gc dolt health --json | gc dolt health-check"`).
# Runs at the end of the night-run window so the corpus is fresh for the day.
[order]
description = "Scan corpus maturity / refresh decay ranking (was: ao maturity --scan)"
trigger = "cron"
schedule = "0 7 * * *"          # 07:00 — end of the night-run ingest window
exec = "ao maturity --scan"
