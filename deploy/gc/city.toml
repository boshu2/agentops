# Portable city policy. deploy/gc/bootstrap.sh replaces the runtime sentinels
# in the generated city with this city's private paths.

[workspace]
max_active_sessions = 1
# Managed local sessions must not inherit a stale machine-wide OTLP endpoint.
# A dead collector otherwise delays nearly every GC/bd command.
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", AO_BIN = "__GC_AGENTOPS_AO_BIN__", AGENTOPS_FACTORY_FEEDER = "__GC_AGENTOPS_FACTORY_FEEDER__", AGENTOPS_GC_DELIVERY_BIN = "__GC_AGENTOPS_DELIVERY_BIN__", AGENTOPS_GC_BEADS_BIN = "__GC_AGENTOPS_BD_BIN__", AGENTOPS_GC_GIT_BIN = "__GC_AGENTOPS_GIT_BIN__", AGENTOPS_GC_GH_BIN = "__GC_AGENTOPS_GH_BIN__", AGENTOPS_GC_BASH_BIN = "__GC_AGENTOPS_BASH_BIN__", AGENTOPS_GC_DELIVERY_ROOT = "__GC_AGENTOPS_DELIVERY_ROOT__", AGENTOPS_GC_DELIVERY_NATIVE_CONTEXT = "__GC_AGENTOPS_DELIVERY_NATIVE_CONTEXT__", AGENTOPS_GC_DELIVERY_NATIVE_CONTEXT_DIGEST = "__GC_AGENTOPS_DELIVERY_NATIVE_CONTEXT_DIGEST__", AGENTOPS_GC_DELIVERY_RIG = "__GC_AGENTOPS_DELIVERY_RIG__", AGENTOPS_GC_DELIVERY_REPOSITORY = "__GC_AGENTOPS_DELIVERY_REPOSITORY__", AGENTOPS_GC_DELIVERY_REMOTE = "origin", AGENTOPS_GC_DELIVERY_MODE = "__GC_AGENTOPS_DELIVERY_MODE__", AGENTOPS_GC_DELIVERY_DEADLINE_SECONDS = "86400", GC_OTEL_METRICS_URL = "__GC_AGENTOPS_OTEL_METRICS_URL__", GC_OTEL_LOGS_URL = "__GC_AGENTOPS_OTEL_LOGS_URL__", OTEL_EXPORTER_OTLP_ENDPOINT = "" }

# GC v1.3.5's stable core exec orders include scripts that call bare `gc`.
# Bind both PATH and GC_BIN through the supported order override so multiple
# installed GC versions cannot mix inside one city.
[[orders.overrides]]
name = "beads-health"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "cascade-nudge-on-blocker-close"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "cross-rig-deps"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "gate-sweep"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "jsonl-export"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "nudge-mail-sweep"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "nudge-on-route"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "order-tracking-sweep"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "orphan-sweep"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "prune-branches"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "reaper"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "spawn-storm-detect"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

[[orders.overrides]]
name = "wisp-compact"
env = { GC_BIN = "__GC_AGENTOPS_GC_BIN__", PATH = "__GC_AGENTOPS_ORDER_PATH__" }

# Workspace env is session-scoped in Gas City. Exec orders run on the
# controller, so bind the deterministic Refiner sweep through GC's supported
# per-order override instead of the supervisor's ambient process environment.
[[orders.overrides]]
name = "agentops-delivery-sweep"
rig = "__GC_AGENTOPS_DELIVERY_RIG__"

[orders.overrides.env]
GC_BIN = "__GC_AGENTOPS_GC_BIN__"
PATH = "__GC_AGENTOPS_ORDER_PATH__"
AGENTOPS_GC_DELIVERY_BIN = "__GC_AGENTOPS_DELIVERY_BIN__"
AGENTOPS_GC_BEADS_BIN = "__GC_AGENTOPS_BD_BIN__"
AGENTOPS_GC_GIT_BIN = "__GC_AGENTOPS_GIT_BIN__"
AGENTOPS_GC_GH_BIN = "__GC_AGENTOPS_GH_BIN__"
AGENTOPS_GC_BASH_BIN = "__GC_AGENTOPS_BASH_BIN__"
AGENTOPS_GC_DELIVERY_ROOT = "__GC_AGENTOPS_DELIVERY_ROOT__"
AGENTOPS_GC_DELIVERY_NATIVE_CONTEXT = "__GC_AGENTOPS_DELIVERY_NATIVE_CONTEXT__"
AGENTOPS_GC_DELIVERY_NATIVE_CONTEXT_DIGEST = "__GC_AGENTOPS_DELIVERY_NATIVE_CONTEXT_DIGEST__"
AGENTOPS_GC_DELIVERY_RIG = "__GC_AGENTOPS_DELIVERY_RIG__"
AGENTOPS_GC_DELIVERY_REPOSITORY = "__GC_AGENTOPS_DELIVERY_REPOSITORY__"
AGENTOPS_GC_DELIVERY_REMOTE = "origin"
AGENTOPS_GC_DELIVERY_MODE = "__GC_AGENTOPS_DELIVERY_MODE__"
AGENTOPS_GC_DELIVERY_DEADLINE_SECONDS = "86400"

[session]
# The bootstrap replaces this with a stable digest of the canonical city path.
# City basenames are not unique (disposable canaries commonly end in `/city`),
# while tmux socket names are machine-global.  A path-bound socket prevents one
# city's controller or teardown from observing or killing another city's agents.
socket = "__GC_AGENTOPS_TMUX_SOCKET__"
# GC materializes the role's assigned skill catalog in PreStart. On a cold city
# that operation can contend with the controller's scope-wide materialization;
# the SDK's 10s default is too short and converts harmless contention into a
# failed-create/retry storm.
setup_timeout = "60s"
[providers.codex]
base = "builtin:codex"
# Codex discards a positional startup prompt when a first-use workspace trust
# dialog precedes the TUI. Gas City's supported `none` mode delivers the
# rendered prompt as a native post-readiness nudge, after startup dialogs have
# been handled, so a fresh managed worktree cannot silently lose its packet.
prompt_mode = "none"
# GC projects a fixed, reviewed hook set into every disposable worktree. Fresh
# Codex sessions cannot persist per-worktree trust before claiming their bead,
# so automation must explicitly bypass that otherwise-interactive prompt.
args_append = ["--dangerously-bypass-hook-trust", "__GC_AGENTOPS_CODEX_SCOPE_ARGS__"]
options_schema_merge = "replace"
option_defaults = { permission_mode = "auto-edit", model = "gpt-5.6-terra", effort = "high" }
env = { CODEX_HOME = "__GC_AGENTOPS_CODEX_HOME__" }

[[providers.codex.options_schema]]
key = "permission_mode"
label = "Approval Policy"
type = "select"
default = "auto-edit"

  [[providers.codex.options_schema.choices]]
  value = "auto-edit"
  label = "Workspace write, no prompts"
  flag_args = ["--sandbox", "workspace-write", "--ask-for-approval", "never", "-c", "sandbox_workspace_write.network_access=true"]

  [[providers.codex.options_schema.choices]]
  value = "unrestricted"
  label = "Unrestricted managed session"
  flag_args = ["--dangerously-bypass-approvals-and-sandbox"]

[[providers.codex.options_schema]]
key = "model"
label = "Role-pinned model"
type = "select"
default = "gpt-5.6-terra"

  [[providers.codex.options_schema.choices]]
  value = "gpt-5.6-terra"
  label = "GPT-5.6 Terra worker"
  flag_args = ["--model", "gpt-5.6-terra"]

  [[providers.codex.options_schema.choices]]
  value = "gpt-5.6-sol"
  label = "GPT-5.6 Sol judge"
  flag_args = ["--model", "gpt-5.6-sol"]

[[providers.codex.options_schema]]
key = "effort"
label = "Role-pinned reasoning effort"
type = "select"
default = "high"

  [[providers.codex.options_schema.choices]]
  value = "high"
  label = "High reasoning"
  flag_args = ["-c", "model_reasoning_effort=high"]

[providers.claude]
base = "builtin:claude"
command = "__GC_AGENTOPS_CLAUDE_WRAPPER__"
path_check = "claude"
# Claude roles run in GC-owned interactive tmux sessions. AgentOps never uses
# Claude's headless print sink; fresh role contexts come from GC wake_mode and
# the session/bead identity attested by the adapter. bootstrap.sh also adds
# --safe-mode after the exact managed writable roots so factory roles do not
# inherit the operator's unrelated hooks, plugins, MCP servers, or CLAUDE.md.
args_append = ["__GC_AGENTOPS_CLAUDE_SCOPE_ARGS__"]
print_args = []
options_schema_merge = "replace"
option_defaults = { permission_mode = "unrestricted", model = "opus-4.8", effort = "medium" }

[[providers.claude.options_schema]]
key = "permission_mode"
label = "Permission Mode"
type = "select"
default = "unrestricted"

  [[providers.claude.options_schema.choices]]
  value = "auto"
  label = "Auto mode with safety checks"
  flag_args = ["--permission-mode", "auto"]

  [[providers.claude.options_schema.choices]]
  value = "unrestricted"
  label = "Unrestricted interactive session"
  flag_args = ["--dangerously-skip-permissions"]

[[providers.claude.options_schema]]
key = "model"
label = "Role-pinned model"
type = "select"
default = "opus-4.8"

  [[providers.claude.options_schema.choices]]
  value = "opus-4.8"
  label = "Claude Opus 4.8"
  flag_args = ["--model", "claude-opus-4-8"]

  [[providers.claude.options_schema.choices]]
  value = "fable-5"
  label = "Claude Fable 5"
  flag_args = ["--model", "claude-fable-5"]

[[providers.claude.options_schema]]
key = "effort"
label = "Role-pinned reasoning effort"
type = "select"
default = "medium"

  [[providers.claude.options_schema.choices]]
  value = "medium"
  label = "Medium reasoning"
  flag_args = ["--effort", "medium"]

  [[providers.claude.options_schema.choices]]
  value = "adaptive"
  label = "Adaptive role policy (no launch flag)"
  flag_args = []


# Gas City's scaffold imports maintenance workers. Provider-derived implicit
# agents are injected only after patches are applied, so they cannot lawfully
# be suspended with patches in GC v1.3.5. bootstrap.sh projects explicit,
# suspended city convention agents and the executor pack supplies equivalent
# rig agents; those exact identities shadow implicit injection. Only checked
# AgentOps roles may consume bounded session capacity.
[[patches.agent]]
name = "bd.dog"
suspended = true

[[patches.agent]]
name = "core.control-dispatcher"
suspended = true
